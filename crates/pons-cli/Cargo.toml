[package]
name = "pons-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "pons"

[[bin]]
name = "pons"
path = "src/main.rs"

[[bin]]
name = "cargo-pons"
path = "src/cargo_pons.rs"

[dependencies]
pons-ir = { path = "../pons-ir" }
pons-plugin = { path = "../pons-plugin" }
pons-emit-ts = { path = "../pons-emit-ts" }
pons-emit-openapi = { path = "../pons-emit-openapi" }
serde_json.workspace = true
tempfile = "3.27.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
