[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pons-fastapi"
version = "0.1.0"
description = "Read a FastAPI application and emit Pons IR"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2",
]

[project.optional-dependencies]
test = [
    "httpx",
    "jsonschema",
    "pytest",
]

[project.scripts]
pons-fastapi = "pons_fastapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pons_fastapi*"]
