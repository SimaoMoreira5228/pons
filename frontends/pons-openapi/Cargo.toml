[package]
name = "pons-openapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OpenAPI 3.1 importer for Pons API contracts"
keywords = ["openapi", "api", "ir", "codegen"]
categories = ["development-tools", "web-programming"]

[dependencies]
pons-core = { path = "../../core/rust/pons-core" }
pons-ir = { path = "../../core/rust/pons-ir" }
pons-json-schema = { path = "../../core/rust/pons-json-schema" }
serde_json.workspace = true
serde_yaml_ng = "0.10"

[dev-dependencies]
pons-emit-openapi = { path = "../../emitters/pons-emit-openapi" }
