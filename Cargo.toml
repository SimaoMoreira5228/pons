[workspace]
members = ["crates/pons-axum", "crates/pons-cli", "crates/pons-core", "crates/pons-derive", "crates/pons-emit-openapi", "crates/pons-emit-ts", "crates/pons-ir", "crates/pons-plugin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
syn = "3"
quote = "1"
proc-macro2 = "1"
serde_derive_internals = "0.30.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "multipart", "query"] }
futures-util = "0.3"
tower-layer = "0.3"
tower-service = "0.3"
