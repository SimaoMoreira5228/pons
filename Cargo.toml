[workspace]
members = ["conformance/reference-api", "conformance/pons-conformance", "cli/pons-cli", "core/rust/pons-core", "core/rust/pons-derive", "core/rust/pons-ir", "core/rust/pons-json-schema", "core/rust/pons-plugin", "core/rust/pons-schemars", "core/rust/pons-specta", "core/rust/pons-utoipa", "emitters/pons-emit-openapi", "emitters/pons-emit-ts", "frontends/pons-actix", "frontends/pons-axum", "frontends/pons-openapi", "frontends/pons-tako", "frontends/pons-tako-macros"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
schemars = "1.2.2"
specta = { version = "2.0.0-rc.28", features = ["derive"] }
utoipa = "6.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
syn = "3"
quote = "1"
proc-macro2 = "1"
serde_derive_internals = "0.30.0"
axum = { version = "0.8.9", default-features = false, features = ["form", "json", "multipart", "query"] }
actix-web = { version = "4.19", default-features = false, features = ["macros"] }
futures-util = "0.3"
libc = "0.2"
tower-layer = "0.3"
tower-service = "0.3"
